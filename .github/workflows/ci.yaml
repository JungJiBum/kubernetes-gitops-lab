name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    changes:
        name: Detect Image Changes
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pull-requests: read

        outputs:
            image: ${{ steps.filter.outputs.image }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Detect changed files
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      image:
                        - 'app/**'
                        - 'Dockerfile'
                        - 'requirements.txt'
    test:
        name: Python Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt

            - name: Install dependencies
              run: python -m pip install -r requirements-dev.txt

            - name: Run tests
              run: python -m pytest tests/ -v
    build:
        name: Build and Push Docker Image
        needs: [test, changes]
        if: >-
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            needs.changes.outputs.image == 'true'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ghcr.io/jungjibum/kubernetes-gitops-lab:${{ github.sha }}
    update-dev:
        name: Update DEV Image
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: main
                  persist-credentials: true

            - name: Update DEV image tag
              env:
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  python - <<'PY'
                  import os
                  import re
                  from pathlib import Path

                  path = Path("k8s/overlays/dev/kustomization.yaml")
                  content = path.read_text()

                  updated, count = re.subn(
                      r"(newTag:\s*)[^\s]+",
                      lambda match: match.group(1) + os.environ["IMAGE_TAG"],
                      content,
                  )

                  if count != 1:
                      raise SystemExit(f"Expected one newTag, found {count}")

                  path.write_text(updated)
                  PY

            - name: Commit and push DEV image update
              env:
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add k8s/overlays/dev/kustomization.yaml

                  if git diff --cached --quiet; then
                    echo "No image update needed"
                    exit 0
                  fi

                  git commit -m "deploy: update dev image to ${IMAGE_TAG} [skip ci]"
                  git push origin HEAD:main
