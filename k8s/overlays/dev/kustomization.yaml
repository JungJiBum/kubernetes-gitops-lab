apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-dev

resources:
  - ../../base

replicas:
  - name: gitops-api
    count: 1

images:
  - name: ghcr.io/jungjibum/kubernetes-gitops-lab
    newTag: 7b07c085a43b20b150fe2f925addf78fe56ef2fc

configMapGenerator:
  - name: gitops-api-config
    literals:
      - APP_ENV=dev
      - APP_VERSION=v5
