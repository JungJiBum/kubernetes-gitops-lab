apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-dev

resources:
  - ../../base

replicas:
  - name: gitops-api
    count: 1

images:
  - name: ghcr.io/jungjibum/kubernetes-gitops-lab
    newTag: ccdbc805f2a3a095ffd480aa9d152fb02f7804a7

configMapGenerator:
  - name: gitops-api-config
    literals:
      - APP_ENV=dev
      - APP_VERSION=v5
