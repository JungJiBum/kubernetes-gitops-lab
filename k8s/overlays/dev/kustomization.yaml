apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-dev

resources:
  - ../../base

replicas:
  - name: gitops-api
    count: 1

images:
  - name: ghcr.io/jungjibum/kubernetes-gitops-lab
    newTag: ba6268acadd54bc220de54c8db5e452288376c6f

configMapGenerator:
  - name: gitops-api-config
    literals:
      - APP_ENV=dev
      - APP_VERSION=v5
