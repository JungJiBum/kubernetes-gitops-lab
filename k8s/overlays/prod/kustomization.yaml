apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-prod

resources:
  - ../../base

replicas:
  - name: gitops-api
    count: 2

configMapGenerator:
  - name: gitops-api-config
    literals:
      - APP_ENV=prod
      - APP_VERSION=v4
images:
  - name: ghcr.io/jungjibum/kubernetes-gitops-lab
    newTag: ba6268acadd54bc220de54c8db5e452288376c6f
